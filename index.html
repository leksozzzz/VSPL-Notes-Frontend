<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSPL Notes — вход</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="auth" class="auth-page">

    <header class="auth-header">
        <a href="index.html" class="logo" data-logo>
            <span class="logo-icon">▤</span>VSPL Notes
        </a>
    </header>

    <main class="auth-main">
        <div class="auth-card">

            <div class="auth-tabs" role="tablist">
                <button type="button" class="auth-tab" role="tab" id="tab-login"
                        data-tab="login" aria-selected="true">Вход</button>
                <button type="button" class="auth-tab" role="tab" id="tab-register"
                        data-tab="register" aria-selected="false">Регистрация</button>
            </div>

            <!-- Форма входа -->
            <form id="login-form" novalidate>
                <h1>С возвращением</h1>
                <p class="auth-lead">Войдите, чтобы открыть свои заметки.</p>

                <label class="field">
                    <span>Имя пользователя или email</span>
                    <input type="text" id="login-username" autocomplete="username" required>
                </label>

                <label class="field">
                    <span>Пароль</span>
                    <input type="password" id="login-password" autocomplete="current-password" required>
                </label>

                <p class="form-message" id="login-message" role="status"></p>

                <button type="submit" class="btn btn-primary auth-submit">Войти</button>
            </form>

            <!-- Форма регистрации -->
            <form id="register-form" novalidate hidden>
                <h1>Создать аккаунт</h1>
                <p class="auth-lead">Это займёт меньше минуты.</p>

                <label class="field">
                    <span>Имя пользователя</span>
                    <input type="text" id="register-name" autocomplete="username" maxlength="80" required>
                </label>

                <label class="field">
                    <span>Email</span>
                    <input type="email" id="register-email" autocomplete="email" required>
                </label>

                <label class="field">
                    <span>Пароль (минимум 8 символов)</span>
                    <input type="password" id="register-password" autocomplete="new-password" required>
                </label>

                <label class="field">
                    <span>Повторите пароль</span>
                    <input type="password" id="register-confirm" autocomplete="new-password" required>
                </label>

                <p class="form-message" id="register-message" role="status"></p>

                <button type="submit" class="btn btn-primary auth-submit">Зарегистрироваться</button>
            </form>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
